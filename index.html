<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Konversi Temprature</title>
    </head>

    <body>
        <main class="converter">
            <h1>Temperature Converter</h1>
            <p class="description">
                Konversi Celsius ke Fahrenheit, Reamur, dan Kelvin.
            </p>
            <form id="calc" class="input-group">
                <label for="celsius">Masukkan Celsius (&deg;C)</label>
                <div class="field-row">
                    <input type="number" id="celsius" placeholder="Contoh: 25" step="any" required>
                    <button type="submit">Hitung</button>
                </div>
            </form>
            <table>
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Celsius</th>
                        <th>Fahrenheit</th>
                        <th>Reamur</th>
                        <th>Kelvin</th>
                    </tr>
                </thead>
                <tbody id="resultTable">
                </tbody>
            </table>
        </main>

        <script src="script.js"></script>
    </body>

</html>
