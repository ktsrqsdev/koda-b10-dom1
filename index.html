<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Konversi Temprature</title>
    </head>

    <body>
        <main class="converter">
            <h1>Temperature Converter</h1>
            <p class="description">
                Konversi Celsius ke Fahrenheit, Reamur, dan Kelvin.
            </p>

            <section>
                <p class="example">Celsius ke Fahrenheit</p>
                <p id="fahrenheit" class="result"></p>
            </section>

            <section>
                <p class="example">Celsius ke Reamur</p>
                <p id="reamur" class="result"></p>
            </section>

            <section>
                <p class="example">Celsius ke Kelvin</p>
                <p id="kelvin" class="result"></p>
            </section>
        </main>

        <script src="script.js"></script>
    </body>

</html>
